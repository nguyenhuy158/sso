name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # pnpm check (tsc), then `wrangler deploy --dry-run` to catch bundling errors
  # without credentials. `pnpm e2e` mints a throwaway signing key, starts
  # wrangler dev with it and runs both smoke suites; no secrets needed.
  check:
    uses: nguyenhuy158/kit/.github/workflows/check.yml@v0.1.0
    with:
      run-build: true
      run-e2e: true
